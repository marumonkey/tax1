<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전산세무회계 학습앱 MVP</title>
  <style>
    :root{
      --bg:#f8fafc;
      --panel:#ffffff;
      --line:#e2e8f0;
      --text:#0f172a;
      --muted:#64748b;
      --primary:#0f172a;
      --soft:#f1f5f9;
      --blue:#dbeafe;
      --green:#dcfce7;
      --amber:#fef3c7;
      --red:#fee2e2;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Pretendard,sans-serif;background:var(--bg);color:var(--text)}
    .app{display:grid;grid-template-columns:280px 1fr;gap:16px;max-width:1440px;margin:0 auto;padding:16px}
    .sidebar,.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:0 6px 18px rgba(15,23,42,.05)}
    .sidebar{padding:20px;position:sticky;top:16px;height:fit-content}
    .brand{font-size:24px;font-weight:800;margin-bottom:8px}
    .sub{font-size:13px;color:var(--muted);line-height:1.5}
    .company-box{background:var(--soft);border-radius:18px;padding:14px;margin:16px 0}
    .nav{display:grid;gap:8px}
    .nav button,.btn{border:none;background:transparent;padding:12px 14px;border-radius:16px;text-align:left;font-weight:700;cursor:pointer;color:var(--text)}
    .nav button.active{background:var(--primary);color:#fff}
    .nav button:hover,.btn.secondary:hover{background:var(--soft)}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    .btn.primary{background:var(--primary);color:#fff}
    .btn.secondary{border:1px solid var(--line);background:#fff}
    .content{display:grid;gap:16px}
    .grid{display:grid;gap:16px}
    .grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .panel{padding:18px}
    .panel h2,.panel h3{margin:0 0 12px 0}
    .stats .panel{padding:16px}
    .value{font-size:28px;font-weight:800;margin-top:8px}
    .label{font-size:13px;color:var(--muted)}
    .muted{color:var(--muted)}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .stack{display:grid;gap:10px}
    input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:#fff;font:inherit}
    textarea{min-height:110px;resize:vertical}
    .table{display:grid;gap:10px}
    .table-header,.table-row{display:grid;gap:8px;align-items:center;padding:12px 14px;border-radius:16px}
    .table-header{background:var(--soft);font-size:14px;font-weight:800}
    .table-row{border:1px solid var(--line);background:#fff}
    .cols-5h{grid-template-columns:1.1fr .9fr .9fr .9fr .9fr}
    .cols-6h{grid-template-columns:1fr 1fr 1fr 1fr 1fr auto}
    .cols-ledger{grid-template-columns:1fr 1.2fr .8fr .8fr .8fr}
    .cols-journal{grid-template-columns:1fr 1.2fr 1fr 1fr .8fr auto}
    .badge{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--soft)}
    .badge.plus{background:var(--blue)}
    .badge.minus{background:var(--green)}
    .badge.no{background:var(--red)}
    .badge.yes{background:var(--green)}
    .box{background:var(--soft);padding:14px;border-radius:18px}
    .hidden{display:none !important}
    .tabs{display:flex;gap:8px;flex-wrap:wrap}
    .tabs button{padding:10px 14px;border:1px solid var(--line);background:#fff;border-radius:14px;cursor:pointer;font-weight:700}
    .tabs button.active{background:var(--primary);color:#fff}
    .section-title{font-size:20px;font-weight:800;margin-bottom:10px}
    .small{font-size:13px}
    .right{text-align:right}
    .center{text-align:center}
    .danger{color:#b91c1c}
    .success{color:#166534}
    @media (max-width: 1024px){
      .app{grid-template-columns:1fr}
      .sidebar{position:static}
      .grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">전산세무회계 앱</div>
      <div class="sub">분개 · 전기 · 부가세 공제판정 · 조정명세서까지 한 번에 확인하는 GitHub Pages용 단일 파일 버전입니다.</div>
      <div class="company-box">
        <div><strong id="companyNameBox">샘플회사</strong></div>
        <div class="small muted">대표 <span id="companyCeoBox">홍길동</span> · 사업연도 <span id="companyYearBox">2026</span></div>
      </div>
      <div class="nav" id="nav"></div>
      <div class="actions">
        <button class="btn primary" id="saveBtn">저장</button>
        <button class="btn secondary" id="resetBtn">초기화</button>
      </div>
      <div class="small muted" style="margin-top:10px">마지막 저장: <span id="savedAt">없음</span></div>
    </aside>

    <main class="content">
      <section id="dashboard" class="view"></section>
      <section id="glossary" class="view hidden"></section>
      <section id="journal" class="view hidden"></section>
      <section id="ledger" class="view hidden"></section>
      <section id="trial" class="view hidden"></section>
      <section id="vat" class="view hidden"></section>
      <section id="adjustment" class="view hidden"></section>
      <section id="gpt" class="view hidden"></section>
    </main>
  </div>

  <script>
    const STORAGE_KEY = 'tax_app_static_v1';

    const seedAccounts = [
      '현금','보통예금','외상매출금','상품','비품','미수금','부가세대급금',
      '매출원가','급여','임차료','접대비','광고선전비','복리후생비','감가상각비',
      '미지급금','부가세예수금','매출'
    ];

    const accountTypes = {
      '현금':'자산','보통예금':'자산','외상매출금':'자산','상품':'자산','비품':'자산','미수금':'자산','부가세대급금':'자산',
      '매출원가':'비용','급여':'비용','임차료':'비용','접대비':'비용','광고선전비':'비용','복리후생비':'비용','감가상각비':'비용',
      '미지급금':'부채','부가세예수금':'부채','매출':'수익'
    };

    const seedTerms = [
      {id:1, category:'법인세', term:'손금불산입', definition:'회계상 비용이지만 세법상 손금으로 인정되지 않아 가산조정하는 항목입니다.', examTip:'접대비 한도초과, 업무무관비용, 가지급금 인정이자와 함께 자주 출제됩니다.', practical:'세무조정명세서에서 가산조정으로 반영합니다.'},
      {id:2, category:'법인세', term:'익금불산입', definition:'회계상 수익이지만 세법상 과세하지 않아 차감조정하는 항목입니다.', examTip:'수입배당금 익금불산입이 대표적입니다.', practical:'유보·기타·사외유출 처분과 함께 보아야 합니다.'},
      {id:3, category:'부가가치세', term:'매입세액불공제', definition:'세금계산서가 있어도 법에서 공제하지 않는 매입세액입니다.', examTip:'접대비, 비영업용 소형승용차, 면세사업 관련 매입을 함께 정리하세요.', practical:'공제판정 오류가 나면 신고서가 틀어집니다.'},
      {id:4, category:'재무회계', term:'감가상각', definition:'유형자산의 취득원가를 내용연수에 걸쳐 비용 배분하는 회계처리입니다.', examTip:'정액법, 정률법, 월할계산을 함께 정리하면 좋습니다.', practical:'회계상 감가상각과 세법상 한도 차이로 조정이 발생합니다.'},
      {id:5, category:'원천세', term:'근로소득 간이세액', definition:'급여 지급 시 원천징수하는 세액입니다.', examTip:'총급여·비과세·인적공제를 함께 보세요.', practical:'급여대장과 원천징수 신고자료 일치 여부를 확인해야 합니다.'}
    ];

    const seedAdjustments = [
      {id:1, section:'손금불산입', name:'접대비 한도초과', type:'가산', defaultMemo:'한도 초과액 손금불산입'},
      {id:2, section:'손금불산입', name:'업무무관비용', type:'가산', defaultMemo:'업무 관련성 검토 필요'},
      {id:3, section:'손금불산입', name:'가지급금 인정이자', type:'가산', defaultMemo:'업무무관 가지급금 검토'},
      {id:4, section:'익금불산입', name:'수입배당금 익금불산입', type:'차감', defaultMemo:'차감조정'},
      {id:5, section:'손금산입', name:'이월결손금 공제', type:'차감', defaultMemo:'공제 한도 검토'},
      {id:6, section:'손금불산입', name:'감가상각비 한도초과', type:'가산', defaultMemo:'세법상 한도 초과분'},
      {id:7, section:'손금불산입', name:'대손충당금 한도초과', type:'가산', defaultMemo:'한도 초과분'},
      {id:8, section:'손금불산입', name:'기부금 한도초과', type:'가산', defaultMemo:'손금산입 한도 초과'},
      {id:9, section:'익금산입', name:'자산수증이익', type:'가산', defaultMemo:'무상수증 관련'},
      {id:10, section:'익금불산입', name:'국고보조금', type:'차감', defaultMemo:'압축기장충당금 연계 검토'}
    ];

    const state = loadState() || {
      company: { name:'샘플회사', ceo:'홍길동', year:'2026' },
      entries: [],
      glossary: seedTerms,
      selectedLedger: '현금',
      bookProfit: '',
      adjustments: [],
      vatSales: [],
      vatPurchases: [],
      savedAt: ''
    };

    const menu = [
      ['dashboard','대시보드'],
      ['glossary','용어사전'],
      ['journal','분개입력'],
      ['ledger','전기원장'],
      ['trial','합계잔액시산표'],
      ['vat','부가세 공제판정'],
      ['adjustment','조정명세서'],
      ['gpt','GPT 설명']
    ];

    let currentView = 'dashboard';

    function saveState(){
      state.savedAt = new Date().toLocaleString('ko-KR');
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderAll();
      alert('저장되었습니다.');
    }
    function resetState(){
      if(!confirm('저장된 데이터를 초기화할까요?')) return;
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }
    function loadState(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      }catch(e){
        return null;
      }
    }
    function won(n){ return Number(n || 0).toLocaleString('ko-KR'); }
    function uid(){ return Date.now() + Math.random().toString(16).slice(2); }
    function esc(s){ return String(s ?? '').replace(/[&<>'"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

    function getLedgerMap(){
      const map = {};
      seedAccounts.forEach(a => map[a] = []);
      state.entries.forEach(e => {
        if(!map[e.debit]) map[e.debit] = [];
        if(!map[e.credit]) map[e.credit] = [];
        map[e.debit].push({ id:e.id+'d', date:e.date, description:e.description, debit:Number(e.amount||0), credit:0 });
        map[e.credit].push({ id:e.id+'c', date:e.date, description:e.description, debit:0, credit:Number(e.amount||0) });
      });
      Object.keys(map).forEach(acc => {
        let running = 0;
        const normal = ['자산','비용'].includes(accountTypes[acc]) ? 'debit' : 'credit';
        map[acc] = map[acc].map(r => {
          running += normal === 'debit' ? r.debit - r.credit : r.credit - r.debit;
          return {...r, balance: running};
        });
      });
      return map;
    }

    function getTrialBalance(){
      const ledgerMap = getLedgerMap();
      return seedAccounts.map(acc => {
        const rows = ledgerMap[acc] || [];
        const debitTotal = rows.reduce((s,r) => s + r.debit, 0);
        const creditTotal = rows.reduce((s,r) => s + r.credit, 0);
        const type = accountTypes[acc] || '자산';
        const balance = ['자산','비용'].includes(type) ? debitTotal - creditTotal : creditTotal - debitTotal;
        return {acc, type, debitTotal, creditTotal, balance};
      });
    }

    function getVatSummary(){
      const salesOutputTax = state.vatSales.reduce((s,r)=>s+Number(r.taxAmount||0),0);
      const deductibleInputTax = state.vatPurchases.filter(r=>r.deductible==='공제').reduce((s,r)=>s+Number(r.taxAmount||0),0);
      const nonDeductibleInputTax = state.vatPurchases.filter(r=>r.deductible==='불공제').reduce((s,r)=>s+Number(r.taxAmount||0),0);
      return {
        salesOutputTax,
        deductibleInputTax,
        nonDeductibleInputTax,
        payable: salesOutputTax - deductibleInputTax + nonDeductibleInputTax
      };
    }

    function getAdjustmentSummary(){
      const plus = state.adjustments.filter(a=>a.type==='가산').reduce((s,a)=>s+Number(a.amount||0),0);
      const minus = state.adjustments.filter(a=>a.type==='차감').reduce((s,a)=>s+Number(a.amount||0),0);
      return { plus, minus, taxable: Number(state.bookProfit||0) + plus - minus };
    }

    function renderNav(){
      const nav = document.getElementById('nav');
      nav.innerHTML = menu.map(([id,label]) => `
        <button class="${currentView===id?'active':''}" onclick="switchView('${id}')">${label}</button>
      `).join('');
    }

    window.switchView = function(id){
      currentView = id;
      document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
      renderNav();
    };

    function renderDashboard(){
      const vat = getVatSummary();
      const adj = getAdjustmentSummary();
      const trial = getTrialBalance();
      const sales = state.entries.filter(e=>e.credit==='매출').reduce((s,e)=>s+Number(e.amount||0),0);
      const expenses = state.entries.filter(e=>['급여','임차료','접대비','광고선전비','복리후생비','감가상각비','매출원가'].includes(e.debit)).reduce((s,e)=>s+Number(e.amount||0),0);
      document.getElementById('dashboard').innerHTML = `
        <div class="grid cols-4 stats">
          <div class="panel"><div class="label">등록 분개</div><div class="value">${state.entries.length}건</div><div class="small muted">분개 입력 누적</div></div>
          <div class="panel"><div class="label">전기 계정수</div><div class="value">${trial.filter(t=>t.debitTotal||t.creditTotal).length}개</div><div class="small muted">자동 전기된 계정</div></div>
          <div class="panel"><div class="label">부가세 납부예상액</div><div class="value">${won(vat.payable)}원</div><div class="small muted">매출세액 - 공제 + 불공제</div></div>
          <div class="panel"><div class="label">과세표준 기초</div><div class="value">${won(adj.taxable)}원</div><div class="small muted">회계이익 + 가산 - 차감</div></div>
        </div>
        <div class="grid cols-3">
          <div class="panel">
            <h3>빠른 안내</h3>
            <div class="box small">이 버전은 GitHub Pages에 올리기 쉬운 단일 HTML 파일입니다. 먼저 이 방식으로 공개 테스트해보는 것이 좋습니다.</div>
          </div>
          <div class="panel">
            <h3>분개 요약</h3>
            <div class="stack small">
              <div class="row"><span>추정 매출</span><strong>${won(sales)}원</strong></div>
              <div class="row"><span>추정 비용</span><strong>${won(expenses)}원</strong></div>
              <div class="row"><span>추정 이익</span><strong>${won(sales-expenses)}원</strong></div>
            </div>
          </div>
          <div class="panel">
            <h3>조정 요약</h3>
            <div class="stack small">
              <div class="row"><span>회계상 이익</span><strong>${won(state.bookProfit)}원</strong></div>
              <div class="row"><span>가산조정</span><strong>${won(adj.plus)}원</strong></div>
              <div class="row"><span>차감조정</span><strong>${won(adj.minus)}원</strong></div>
            </div>
          </div>
        </div>
      `;
    }

    function renderGlossary(){
      const view = document.getElementById('glossary');
      view.innerHTML = `
        <div class="panel">
          <h2>용어사전</h2>
          <input id="termSearch" placeholder="용어, 설명, 카테고리 검색" />
          <div id="termList" class="stack" style="margin-top:14px"></div>
        </div>
      `;
      const input = document.getElementById('termSearch');
      const list = document.getElementById('termList');
      function draw(){
        const q = input.value.toLowerCase();
        const items = state.glossary.filter(t => [t.term,t.definition,t.category,t.examTip,t.practical].join(' ').toLowerCase().includes(q));
        list.innerHTML = items.map(t => `
          <div class="panel">
            <div class="row"><div><span class="badge">${esc(t.category)}</span> <strong>${esc(t.term)}</strong></div></div>
            <div class="small" style="margin-top:10px"><strong>정의:</strong> ${esc(t.definition)}</div>
            <div class="small" style="margin-top:6px"><strong>시험 포인트:</strong> ${esc(t.examTip)}</div>
            <div class="small" style="margin-top:6px"><strong>실무 포인트:</strong> ${esc(t.practical)}</div>
          </div>
        `).join('') || '<div class="box small">검색 결과가 없습니다.</div>';
      }
      input.addEventListener('input', draw);
      draw();
    }

    function renderJournal(){
      const view = document.getElementById('journal');
      view.innerHTML = `
        <div class="grid cols-2">
          <div class="panel">
            <h2>분개 입력</h2>
            <div class="grid cols-2">
              <input id="jDate" type="date" value="2026-03-10" />
              <input id="jDesc" placeholder="적요" />
              <select id="jDebit">${seedAccounts.map(a=>`<option>${a}</option>`).join('')}</select>
              <select id="jCredit">${seedAccounts.map(a=>`<option>${a}</option>`).join('')}</select>
              <input id="jAmount" type="number" placeholder="금액" />
              <button class="btn primary" onclick="addJournal()">분개 추가</button>
            </div>
          </div>
          <div class="panel">
            <h2>설명</h2>
            <div class="box small">입력한 분개는 전기원장과 합계잔액시산표로 자동 연결됩니다.</div>
          </div>
        </div>
        <div class="panel">
          <h2>분개장</h2>
          <div class="table">
            <div class="table-header cols-journal"><div>날짜</div><div>적요</div><div>차변</div><div>대변</div><div class="right">금액</div><div class="center">관리</div></div>
            ${state.entries.map(e => `
              <div class="table-row cols-journal">
                <div>${esc(e.date)}</div><div>${esc(e.description)}</div><div>${esc(e.debit)}</div><div>${esc(e.credit)}</div><div class="right">${won(e.amount)}</div>
                <div class="center"><button class="btn secondary" onclick="deleteJournal('${e.id}')">삭제</button></div>
              </div>
            `).join('') || '<div class="box small">입력된 분개가 없습니다.</div>'}
          </div>
        </div>
      `;
    }

    window.addJournal = function(){
      const date = document.getElementById('jDate').value;
      const description = document.getElementById('jDesc').value.trim();
      const debit = document.getElementById('jDebit').value;
      const credit = document.getElementById('jCredit').value;
      const amount = document.getElementById('jAmount').value;
      if(!description || !amount){ alert('적요와 금액을 입력해주세요.'); return; }
      state.entries.unshift({ id:uid(), date, description, debit, credit, amount });
      renderAll();
    };
    window.deleteJournal = function(id){ state.entries = state.entries.filter(e=>e.id!==id); renderAll(); };

    function renderLedger(){
      const ledgerMap = getLedgerMap();
      const rows = ledgerMap[state.selectedLedger] || [];
      const view = document.getElementById('ledger');
      view.innerHTML = `
        <div class="grid cols-2">
          <div class="panel">
            <h2>전기 원장</h2>
            <select id="ledgerSelect">${seedAccounts.map(a=>`<option ${a===state.selectedLedger?'selected':''}>${a}</option>`).join('')}</select>
            <div class="box small" style="margin-top:12px">분개 입력 자료를 기준으로 자동 전기됩니다. 자산·비용 계정은 차변 증가, 부채·수익 계정은 대변 증가 기준으로 잔액을 계산합니다.</div>
          </div>
          <div class="panel">
            <h2>${esc(state.selectedLedger)} 계정원장</h2>
            <div class="table">
              <div class="table-header cols-ledger"><div>날짜</div><div>적요</div><div class="right">차변</div><div class="right">대변</div><div class="right">잔액</div></div>
              ${rows.map(r => `
                <div class="table-row cols-ledger">
                  <div>${esc(r.date)}</div><div>${esc(r.description)}</div><div class="right">${won(r.debit)}</div><div class="right">${won(r.credit)}</div><div class="right"><strong>${won(r.balance)}</strong></div>
                </div>
              `).join('') || '<div class="box small">이 계정의 전기 내역이 없습니다.</div>'}
            </div>
          </div>
        </div>
      `;
      document.getElementById('ledgerSelect').addEventListener('change', e => {
        state.selectedLedger = e.target.value;
        renderLedger();
      });
    }

    function renderTrial(){
      const rows = getTrialBalance();
      document.getElementById('trial').innerHTML = `
        <div class="panel">
          <h2>합계잔액시산표</h2>
          <div class="table">
            <div class="table-header cols-5h"><div>계정과목</div><div>구분</div><div class="right">차변합계</div><div class="right">대변합계</div><div class="right">잔액</div></div>
            ${rows.map(r => `
              <div class="table-row cols-5h">
                <div>${esc(r.acc)}</div><div>${esc(r.type)}</div><div class="right">${won(r.debitTotal)}</div><div class="right">${won(r.creditTotal)}</div><div class="right"><strong>${won(r.balance)}</strong></div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderVat(){
      const vat = getVatSummary();
      document.getElementById('vat').innerHTML = `
        <div class="grid cols-3">
          <div class="panel">
            <h2>매출 등록</h2>
            <div class="stack">
              <input id="vsDate" type="date" value="2026-03-10" />
              <input id="vsClient" placeholder="거래처" />
              <input id="vsSupply" type="number" placeholder="공급가액" />
              <input id="vsTax" type="number" placeholder="세액" />
              <button class="btn primary" onclick="addVatSale()">매출 추가</button>
            </div>
          </div>
          <div class="panel">
            <h2>매입 등록 + 공제판정</h2>
            <div class="stack">
              <input id="vpDate" type="date" value="2026-03-10" />
              <input id="vpVendor" placeholder="거래처" />
              <input id="vpSupply" type="number" placeholder="공급가액" />
              <input id="vpTax" type="number" placeholder="세액" />
              <select id="vpDeductible"><option>공제</option><option>불공제</option></select>
              <input id="vpReason" placeholder="판정 사유 (예: 접대비, 비영업용 승용차)" />
              <button class="btn primary" onclick="addVatPurchase()">매입 추가</button>
            </div>
          </div>
          <div class="panel">
            <h2>부가세 요약</h2>
            <div class="stack small">
              <div class="row"><span>매출세액 합계</span><strong>${won(vat.salesOutputTax)}원</strong></div>
              <div class="row"><span>공제매입세액</span><strong class="success">${won(vat.deductibleInputTax)}원</strong></div>
              <div class="row"><span>불공제매입세액</span><strong class="danger">${won(vat.nonDeductibleInputTax)}원</strong></div>
              <div class="row"><span>납부예상세액</span><strong>${won(vat.payable)}원</strong></div>
              <div class="box small">계산식: 매출세액 - 공제매입세액 + 불공제매입세액</div>
            </div>
          </div>
        </div>
        <div class="grid cols-2">
          <div class="panel">
            <h2>매출세액 등록 내역</h2>
            <div class="table">
              ${state.vatSales.map(r=>`
                <div class="table-row cols-6h">
                  <div>${esc(r.date)}</div><div>${esc(r.client)}</div><div class="right">${won(r.supplyAmount)}</div><div class="right">${won(r.taxAmount)}</div><div></div>
                  <div class="center"><button class="btn secondary" onclick="deleteVatSale('${r.id}')">삭제</button></div>
                </div>
              `).join('') || '<div class="box small">등록된 매출 내역이 없습니다.</div>'}
            </div>
          </div>
          <div class="panel">
            <h2>매입세액 공제판정 내역</h2>
            <div class="table">
              ${state.vatPurchases.map(r=>`
                <div class="table-row cols-6h">
                  <div>${esc(r.date)}</div><div>${esc(r.vendor)}</div><div class="right">${won(r.supplyAmount)}</div><div class="right">${won(r.taxAmount)}</div>
                  <div><span class="badge ${r.deductible==='공제'?'yes':'no'}">${esc(r.deductible)}${r.reason ? ' · ' + esc(r.reason) : ''}</span></div>
                  <div class="center"><button class="btn secondary" onclick="deleteVatPurchase('${r.id}')">삭제</button></div>
                </div>
              `).join('') || '<div class="box small">등록된 매입 내역이 없습니다.</div>'}
            </div>
          </div>
        </div>
      `;
    }

    window.addVatSale = function(){
      const date = document.getElementById('vsDate').value;
      const client = document.getElementById('vsClient').value.trim();
      const supplyAmount = document.getElementById('vsSupply').value;
      const taxAmount = document.getElementById('vsTax').value;
      if(!client || !supplyAmount || !taxAmount){ alert('매출 등록 항목을 입력해주세요.'); return; }
      state.vatSales.unshift({ id:uid(), date, client, supplyAmount, taxAmount });
      renderAll();
    };
    window.addVatPurchase = function(){
      const date = document.getElementById('vpDate').value;
      const vendor = document.getElementById('vpVendor').value.trim();
      const supplyAmount = document.getElementById('vpSupply').value;
      const taxAmount = document.getElementById('vpTax').value;
      const deductible = document.getElementById('vpDeductible').value;
      const reason = document.getElementById('vpReason').value.trim();
      if(!vendor || !supplyAmount || !taxAmount){ alert('매입 등록 항목을 입력해주세요.'); return; }
      state.vatPurchases.unshift({ id:uid(), date, vendor, supplyAmount, taxAmount, deductible, reason });
      renderAll();
    };
    window.deleteVatSale = function(id){ state.vatSales = state.vatSales.filter(r=>r.id!==id); renderAll(); };
    window.deleteVatPurchase = function(id){ state.vatPurchases = state.vatPurchases.filter(r=>r.id!==id); renderAll(); };

    function renderAdjustment(){
      const adj = getAdjustmentSummary();
      document.getElementById('adjustment').innerHTML = `
        <div class="grid cols-2">
          <div class="panel">
            <h2>조정명세 입력</h2>
            <div class="stack">
              <input id="bookProfit" type="number" placeholder="회계상 이익" value="${esc(state.bookProfit)}" />
              <select id="adjItem">${seedAdjustments.map(s=>`<option value="${esc(s.name)}">${esc(s.section)} · ${esc(s.name)}</option>`).join('')}</select>
              <input id="adjAmount" type="number" placeholder="금액" />
              <textarea id="adjMemo" placeholder="처분/메모"></textarea>
              <button class="btn primary" onclick="addAdjustment()">조정 추가</button>
            </div>
          </div>
          <div class="panel">
            <h2>과세표준 기초 계산</h2>
            <div class="stack small">
              <div class="row"><span>회계상 이익</span><strong>${won(state.bookProfit)}원</strong></div>
              <div class="row"><span>가산조정</span><strong>${won(adj.plus)}원</strong></div>
              <div class="row"><span>차감조정</span><strong>${won(adj.minus)}원</strong></div>
              <div class="row"><span>과세표준 기초</span><strong>${won(adj.taxable)}원</strong></div>
            </div>
          </div>
        </div>
        <div class="panel">
          <h2>조정명세서</h2>
          <div class="table">
            <div class="table-header cols-5h"><div>구분</div><div>항목명</div><div class="right">금액</div><div>처분/메모</div><div class="center">관리</div></div>
            ${state.adjustments.map(a=>`
              <div class="table-row cols-5h">
                <div><span class="badge ${a.type==='가산'?'plus':'minus'}">${esc(a.section)}</span></div>
                <div>${esc(a.name)}</div>
                <div class="right">${won(a.amount)}</div>
                <div>${esc(a.memo || '')}</div>
                <div class="center"><button class="btn secondary" onclick="deleteAdjustment('${a.id}')">삭제</button></div>
              </div>
            `).join('') || '<div class="box small">등록된 조정명세가 없습니다.</div>'}
          </div>
        </div>
      `;
      document.getElementById('bookProfit').addEventListener('input', e => { state.bookProfit = e.target.value; renderAdjustment(); renderDashboard(); });
      const first = seedAdjustments[0];
      document.getElementById('adjMemo').value = first.defaultMemo;
      document.getElementById('adjItem').addEventListener('change', e => {
        const found = seedAdjustments.find(s => s.name === e.target.value);
        document.getElementById('adjMemo').value = found ? found.defaultMemo : '';
      });
    }

    window.addAdjustment = function(){
      const selected = document.getElementById('adjItem').value;
      const amount = document.getElementById('adjAmount').value;
      const memo = document.getElementById('adjMemo').value.trim();
      const meta = seedAdjustments.find(s => s.name === selected);
      if(!meta || !amount){ alert('조정 항목과 금액을 입력해주세요.'); return; }
      state.adjustments.unshift({ id:uid(), section:meta.section, name:meta.name, type:meta.type, amount, memo });
      renderAll();
    };
    window.deleteAdjustment = function(id){ state.adjustments = state.adjustments.filter(a=>a.id!==id); renderAll(); };

    function renderGpt(){
      document.getElementById('gpt').innerHTML = `
        <div class="panel">
          <h2>GPT 설명 센터</h2>
          <div class="stack">
            <div class="box">손금불산입과 익금불산입 차이를 초보자에게 쉽게 설명해줘.</div>
            <div class="box">접대비 한도초과가 왜 손금불산입인지 분개와 함께 설명해줘.</div>
            <div class="box">비영업용 소형승용차 관련 부가세 매입세액 불공제를 사례로 설명해줘.</div>
            <div class="box">감가상각비 한도초과의 시험 포인트와 실무 포인트를 비교해줘.</div>
            <div class="box">분개 입력 후 전기와 시산표가 어떻게 이어지는지 예제로 보여줘.</div>
          </div>
        </div>
      `;
    }

    function renderSidebarInfo(){
      document.getElementById('companyNameBox').textContent = state.company.name;
      document.getElementById('companyCeoBox').textContent = state.company.ceo;
      document.getElementById('companyYearBox').textContent = state.company.year;
      document.getElementById('savedAt').textContent = state.savedAt || '없음';
    }

    function renderAll(){
      renderSidebarInfo();
      renderNav();
      renderDashboard();
      renderGlossary();
      renderJournal();
      renderLedger();
      renderTrial();
      renderVat();
      renderAdjustment();
      renderGpt();
      switchView(currentView);
    }

    document.getElementById('saveBtn').addEventListener('click', saveState);
    document.getElementById('resetBtn').addEventListener('click', resetState);
    renderAll();
  </script>
</body>
</html>
